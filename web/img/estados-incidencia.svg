<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Public Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a5665"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b42318"/>
    </marker>
    <style>
      .t{font-size:13px;font-weight:600;fill:#1c2530}
      .c{font-size:11px;font-family:JetBrains Mono,Consolas,monospace;fill:#6b7685}
      .n{font-size:12px;fill:#4a5665}
      .h{font-size:10.5px;fill:#8a96a3;letter-spacing:.06em;font-weight:600}
      .grp{fill:#f5f7f9;stroke:#dde2e8}
      .st{fill:#fff;stroke:#c9d1da;stroke-width:1.2}
    </style>
  </defs>

  <rect x="20" y="20" width="230" height="250" rx="8" class="grp"/>
  <text x="38" y="44" class="h">ESTADOS ABIERTOS</text>
  <rect x="40" y="60" width="190" height="50" rx="6" class="st"/>
  <text x="58" y="82" class="t">Abierta</text><text x="58" y="99" class="c">OP · estado inicial</text>
  <rect x="40" y="128" width="190" height="50" rx="6" class="st"/>
  <text x="58" y="150" class="t">En curso</text><text x="58" y="167" class="c">IP</text>
  <rect x="40" y="196" width="190" height="50" rx="6" class="st" stroke="#9a6200"/>
  <text x="58" y="218" class="t">Pendiente</text><text x="58" y="235" class="c">PE</text>

  <rect x="510" y="20" width="230" height="250" rx="8" class="grp"/>
  <text x="528" y="44" class="h">ESTADOS CERRADOS</text>
  <rect x="530" y="60" width="190" height="50" rx="6" class="st"/>
  <text x="548" y="82" class="t">Completada</text><text x="548" y="99" class="c">CO</text>
  <rect x="530" y="128" width="190" height="50" rx="6" class="st"/>
  <text x="548" y="150" class="t">Cerrada</text><text x="548" y="167" class="c">CL</text>
  <rect x="530" y="196" width="190" height="50" rx="6" class="st"/>
  <text x="548" y="218" class="t">Cancelada</text><text x="548" y="235" class="c">CN</text>

  <path d="M250 120 L506 120" stroke="#4a5665" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="378" y="108" text-anchor="middle" class="n">acción changeStatus</text>
  <text x="378" y="140" text-anchor="middle" class="c">responsable o creador</text>

  <path d="M232 221 C 360 221, 420 150, 528 95" stroke="#b42318" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#r)"/>
  <text x="372" y="226" text-anchor="middle" class="n" style="fill:#b42318">PE → CO / CL bloqueado</text>

  <text x="20" y="296" class="n">1. Solo el responsable o quien creó la incidencia puede cambiar el estado.   2. Pasar a IP exige responsable asignado.</text>
  <text x="20" y="316" class="n">3. En CO, CL y CN el botón se deshabilita (features : instance). El borrado solo se permite en OP.</text>
</svg>
